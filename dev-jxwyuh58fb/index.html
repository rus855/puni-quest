<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>ぷにまるクエスト（デバッグ）</title>
  <link rel="stylesheet" id="css" href="../style.css">
</head>
<body>
  <div id="app">
    <div class="setup" id="gate" style="padding-top:20vh">
      <h1 class="logo sm">🛠 デバッグ</h1>
      <p class="small">作成者用の 確認ページです。合言葉を 入力してください。</p>
      <input id="pw" type="password" placeholder="合言葉" autocomplete="off" style="font-size:20px;text-align:center;border:3px solid #ffb3d1;border-radius:14px;padding:10px;width:80%">
      <button class="big-btn primary" onclick="unlock()">ひらく</button>
      <p class="small" id="gmsg"></p>
    </div>
  </div>
  <div id="modal"></div>
  <div id="toast"></div>
  <div id="updbar" class="hidden"></div>
  <script>
    // 作成者用の デバッグページ（本番の アプリからは どこからも リンクしていない）
    // ・本番と 同じ プログラム（../*.js）を 読みこむので、更新は 自動で 反映される
    // ・セーブデータは 本番と 別の 場所に 保存し、クラウドには 送らない
    var HASH = "30d0065179efbeb31c0a33b7c4f8fbc22ba5f0675d114e5c059bd9972a6934ad";
    async function sha(t) {
      var b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("pq-debug:" + t));
      return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, "0"); }).join("");
    }
    async function unlock() {
      var v = document.getElementById("pw").value.trim();
      if ((await sha(v)) !== HASH) { document.getElementById("gmsg").textContent = "合言葉が ちがいます"; return; }
      try { sessionStorage.setItem("pq_debug_ok", "1"); } catch (e) {}
      boot();
    }
    function boot() {
      window.PQ_DEBUG = true;
      window.PQ_BASE = "../";
      window.PQ_OPEN = true;
      try { window.PQ_DAY = Number(sessionStorage.getItem("pq_debug_day") || 0); window.PQ_SHOWANS = sessionStorage.getItem("pq_debug_ans") === "1"; window.PQ_ZUKANALL = sessionStorage.getItem("pq_debug_zukan") === "1"; } catch (e) {}
      document.getElementById("app").innerHTML = '<div class="loading">よみこみちゅう…</div>';
      // 読みこむ ファイルの 一覧は 本番の index.html から 取る（ファイルが ふえても 自動で 同じに なる）
      var FILES = ["data.js", "world.js", "c_kanji.js", "c_kotoba.js", "c_math.js", "c_sci.js", "c_soc.js", "cloud.js", "pets.js", "app.js"];
      function load(v) {
        window.APP_V = v || 0;
        var q = v ? "?v=" + v : "";
        if (v) document.getElementById("css").href = "../style.css" + q;
        (function next(i) {
          var s = document.createElement("script");
          s.src = i < FILES.length ? "../" + FILES[i] + q : "debug.js" + q;
          s.onload = function () { if (i < FILES.length) next(i + 1); };
          document.body.appendChild(s);
        })(0);
      }
      fetch("../index.html?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.text(); })
        .then(function (t) { var m = t.match(/var FILES = (\[[^\]]*\]);/); if (m) FILES = JSON.parse(m[1]); })
        .catch(function () {})
        .then(function () { return fetch("../version.json?t=" + Date.now(), { cache: "no-store" }); })
        .then(function (r) { return r.json(); })
        .then(function (j) { load(j.v); })
        .catch(function () { load(0); });
    }
    document.getElementById("pw").addEventListener("keydown", function (e) { if (e.key === "Enter") unlock(); });
    try { if (sessionStorage.getItem("pq_debug_ok") === "1") boot(); } catch (e) {}
  </script>
</body>
</html>
